JUDGE0_TELEMETRY_ENABLE=false
ENABLE_WAIT_RESULT=true
ENABLE_COMPILER_OPTIONS=true
ENABLE_COMMAND_LINE_ARGUMENTS=true
ENABLE_BATCHED_SUBMISSIONS=true
ENABLE_CALLBACKS=false
ENABLE_ADDITIONAL_FILES=false
USE_DOCS_AS_HOMEPAGE=true

REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=judge0-js-redis-password

POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0_js
POSTGRES_USER=judge0_js
POSTGRES_PASSWORD=judge0-js-postgres-password

CPU_TIME_LIMIT=2
MAX_CPU_TIME_LIMIT=30
CPU_EXTRA_TIME=1
WALL_TIME_LIMIT=10
MAX_WALL_TIME_LIMIT=45
# Address-space (RLIMIT_AS) budget, not RSS -- see the cgroup note below.
# Measured on the VM: Node 22 aborts with "Failed to reserve virtual memory for
# CodeRange" at 1000000 and succeeds from 1500000 up, because V8 reserves a large
# virtual region regardless of actual use (its real RSS here is ~42 MB).
# 1500000 is the smallest tested value where C, C++, Python, bounded Java and
# JavaScript all pass.
MEMORY_LIMIT=1500000
MAX_MEMORY_LIMIT=4000000
STACK_LIMIT=64000
MAX_PROCESSES_AND_OR_THREADS=60
MAX_FILE_SIZE=1024
MAX_EXTRACT_SIZE=10240
ENABLE_NETWORK=false

# Run isolate WITHOUT cgroups. judge0 (isolate_job.rb:57) passes `--cg` unless
# BOTH of these are true:
#   @cgroups = (!enable_per_process_and_thread_time_limit ||
#               !enable_per_process_and_thread_memory_limit) ? "--cg" : ""
# and both default to false (config.rb uses `== "true"`).
#
# isolate 1.8.1 with --cg requires the cgroup **v1 memory** controller. The GCP
# VM runs kernel 6.17, which gates v1 memcg behind CONFIG_MEMCG_V1, so
# /sys/fs/cgroup has no `memory` entry and isolate dies with
#   Failed to create control group /sys/fs/cgroup/memory/box-0/
# judge0 then uses isolate's empty stdout as the work dir, producing the
# misleading `No such file or directory @ rb_sysopen - /box/script.js` and an
# Internal Error for EVERY language. `isolate --init` without --cg succeeds.
#
# Trade-off: limits become per-process (isolate -m / address space, per-process
# time) rather than cgroup totals, and reported memory is max-rss instead of
# cg-mem. This matches what the existing CAP GCP deployment already does.
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true

RAILS_ENV=production
RAILS_MAX_THREADS=2
RAILS_SERVER_PROCESSES=2
SECRET_KEY_BASE=code-execution-service-isolated-judge0-js-secret
