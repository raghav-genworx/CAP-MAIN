[pytest]
# `src` is a source root, not an installed package: this project declares no
# [build-system], so uv treats it as a virtual project and never puts `src` on
# sys.path. Without this, every test fails at collection with
# "ModuleNotFoundError: No module named 'core'".
pythonpath = src

testpaths = tests

# Mirrors the `-W error` used by .github/workflows/quality.yml so a local run and
# a CI run agree.
filterwarnings =
    error

asyncio_mode = strict

markers =
    unit: pure in-process tests with no external dependency
    integration: requires PostgreSQL (CORE_TEST_DATABASE_URL)
    contract: asserts the frontend-facing /api/v1 contract against a running stack
