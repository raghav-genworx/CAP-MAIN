[project]
name = "core-assessment-platform-service"
version = "0.1.0"
description = "Core Assessment Platform Service"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "fastapi>=0.109.0",
    "google-auth>=2.29.0",
    "httpx>=0.28.0",
    "langgraph>=1.2.5",
    "prometheus-client>=0.20.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "openai>=2.42.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.27.0",
    "redis>=5.0.0",
    # Background job dispatch. The broker URL has been declared in Compose
    # since before the consolidation but no code ever used it.
    "celery>=5.3.0",
    # Merged from code-evaluation-service: PDF report generation and the retry
    # policy used by the Groq code-quality client.
    "reportlab>=4.2.0",
    "tenacity>=8.2.0",
]

[dependency-groups]
# Split so requirements/{base,dev,test}.txt each export from a real group, per the
# COE template. `dev` includes `test`, so `uv sync --dev` still installs everything
# CI needs.
test = [
    # starlette>=1.3 prefers httpx2 for starlette.testclient and warns when it falls
    # back to httpx. Separate module name, so runtime httpx use is unaffected.
    "httpx2>=0.29.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    # Intercepts httpx at the transport layer so adapter tests exercise the
    # real client and real await path without a live upstream.
    "respx>=0.21.1",
]
dev = [
    "httpx>=0.28.0",
    # Celery ships no py.typed marker, so mypy --strict cannot see through its
    # decorators. Stubs keep the task modules type-checked rather than exempt.
    "celery-types>=0.22.0",
    "import-linter>=2.0",
    "mypy>=1.17.0",
    "pre-commit>=4.0.0",
    "ruff>=0.12.0",
    { include-group = "test" },
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "N",
    "SIM",
    "C4",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
disallow_untyped_defs = true
no_implicit_optional = true
