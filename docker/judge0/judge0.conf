JUDGE0_TELEMETRY_ENABLE=false
ENABLE_WAIT_RESULT=true
ENABLE_COMPILER_OPTIONS=true
ENABLE_COMMAND_LINE_ARGUMENTS=true
ENABLE_BATCHED_SUBMISSIONS=true
ENABLE_CALLBACKS=false
ENABLE_ADDITIONAL_FILES=false
USE_DOCS_AS_HOMEPAGE=true

REDIS_HOST=${JUDGE0_REDIS_HOST:-redis}
REDIS_PORT=${JUDGE0_REDIS_PORT:-6379}
REDIS_PASSWORD=${REDIS_PASSWORD:-cap_redis_password}

POSTGRES_HOST=${JUDGE0_POSTGRES_HOST:-postgres}
POSTGRES_PORT=${JUDGE0_POSTGRES_PORT:-5432}
POSTGRES_DB=${JUDGE0_POSTGRES_DB:-judge0}
POSTGRES_USER=${POSTGRES_USER:-cap_user}
POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cap_password}

CPU_TIME_LIMIT=${JUDGE0_CPU_TIME_LIMIT:-2}
MAX_CPU_TIME_LIMIT=${JUDGE0_MAX_CPU_TIME_LIMIT:-15}
CPU_EXTRA_TIME=${JUDGE0_CPU_EXTRA_TIME:-1}
WALL_TIME_LIMIT=${JUDGE0_WALL_TIME_LIMIT:-10}
MAX_WALL_TIME_LIMIT=${JUDGE0_MAX_WALL_TIME_LIMIT:-20}
MEMORY_LIMIT=${JUDGE0_MEMORY_LIMIT:-128000}
MAX_MEMORY_LIMIT=${JUDGE0_MAX_MEMORY_LIMIT:-512000}
STACK_LIMIT=${JUDGE0_STACK_LIMIT:-64000}
MAX_PROCESSES_AND_OR_THREADS=${JUDGE0_MAX_PROCESSES_AND_OR_THREADS:-60}
MAX_FILE_SIZE=${JUDGE0_MAX_FILE_SIZE:-1024}
MAX_EXTRACT_SIZE=${JUDGE0_MAX_EXTRACT_SIZE:-10240}
ENABLE_NETWORK=${JUDGE0_ENABLE_NETWORK:-false}

RAILS_ENV=production
RAILS_MAX_THREADS=${JUDGE0_RAILS_MAX_THREADS:-2}
RAILS_SERVER_PROCESSES=${JUDGE0_RAILS_SERVER_PROCESSES:-2}
SECRET_KEY_BASE=${JUDGE0_SECRET_KEY_BASE:-cap-local-judge0-secret-change-me}
