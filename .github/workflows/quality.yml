name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.11"
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway-service
          - core-assessment-platform-service
          - code-execution-service
          - code-evaluation-service
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --dev --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Test core service
        if: matrix.service == 'core-assessment-platform-service'
        run: uv run pytest -q -W error
      - name: Test service
        if: matrix.service != 'core-assessment-platform-service'
        run: uv run pytest -q -W error

  evaluation-postgres:
    name: Shared Core/Evaluation PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cap_core
          POSTGRES_USER: cap_user
          POSTGRES_PASSWORD: cap_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cap_user -d cap_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: code-evaluation-service
    env:
      UV_PYTHON: "3.11"
      DATABASE_URL: postgresql+psycopg://cap_user:cap_password@localhost:5432/cap_core
      EVALUATION_TEST_DATABASE_URL: postgresql+psycopg://cap_user:cap_password@localhost:5432/cap_core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install evaluation dependencies
        run: uv sync --dev --frozen
      - name: Install core dependencies
        working-directory: core-assessment-platform-service
        run: uv sync --dev --frozen
      - name: Apply core migrations
        working-directory: core-assessment-platform-service
        run: uv run alembic -c alembic.ini upgrade head
      - name: Apply evaluation migrations
        run: uv run alembic -c alembic.ini upgrade head
      - name: Verify PostgreSQL repository
        run: uv run pytest tests/test_postgres_integration.py -q -W error
      - name: Detect evaluation schema drift
        run: uv run alembic -c alembic.ini check
      - name: Detect core schema drift
        working-directory: core-assessment-platform-service
        run: uv run alembic -c alembic.ini check

  core-postgres:
    name: Core PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cap_core
          POSTGRES_USER: cap_user
          POSTGRES_PASSWORD: cap_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cap_user -d cap_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: core-assessment-platform-service
    env:
      UV_PYTHON: "3.11"
      DATABASE_URL: postgresql+psycopg://cap_user:cap_password@localhost:5432/cap_core
      CORE_TEST_DATABASE_URL: postgresql+psycopg://cap_user:cap_password@localhost:5432/cap_core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --dev --frozen
      - name: Apply migrations
        run: uv run alembic -c alembic.ini upgrade head
      - name: Detect schema drift
        run: uv run alembic -c alembic.ini check
      - name: Verify ownership and candidate persistence
        run: uv run pytest tests/test_postgres_integration.py -q -W error

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare ignored environment files
        run: |
          cp core-assessment-platform-service/.env.example core-assessment-platform-service/.env
          cp frontend/.env.example frontend/.env
      - run: docker compose config --quiet
