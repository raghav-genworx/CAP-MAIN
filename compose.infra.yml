# Shared infrastructure: PostgreSQL, Redis, and the Judge0 sandbox.
#
# Its own Compose project so the backend and frontend can be restarted, rebuilt
# or torn down without cycling the database or the sandbox -- which is the slow
# part of a local loop, Judge0 especially.
#
# Start this first. `depends_on` does not reach across projects, so nothing in the
# other files can wait on these; the backend blocks on the database itself via
# `python -m wait_for_db`.
#
#   docker compose -f compose.infra.yml up -d
name: cap-infra

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cap_core}
      POSTGRES_USER: ${POSTGRES_USER:-cap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cap_password}
      JUDGE0_POSTGRES_DB: ${JUDGE0_POSTGRES_DB:-judge0}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - cap-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      cap-net:
        # Explicit: other projects address this as "postgres", and a project-scoped
        # service name is not resolvable from outside the project that declares it.
        aliases: [postgres]
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command:
      - sh
      - -c
      - redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-cap_redis_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - cap-redis-data:/data
    networks:
      cap-net:
        aliases: [redis]
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 5

  judge0-server:
    image: cap/judge0-slim:local
    build: &judge0-slim-build
      context: ./docker/judge0
      dockerfile: Dockerfile
      args:
        JUDGE0_REF: ${JUDGE0_REF:-master}
    volumes:
      - ./docker/judge0/judge0.conf:/api/judge0.conf:ro
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${JUDGE0_POSTGRES_DB:-judge0}
      POSTGRES_USER: ${POSTGRES_USER:-cap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cap_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-cap_redis_password}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${JUDGE0_PORT:-12358}:2358"
    networks:
      cap-net:
        aliases: [judge0-server]
    # Judge0 needs this to build the cgroup sandboxes it runs submissions in.
    # It is the reason candidate code never runs in the application process.
    privileged: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:2358/languages >/dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  judge0-worker:
    image: cap/judge0-slim:local
    build: *judge0-slim-build
    command: [ "./scripts/workers" ]
    volumes:
      - ./docker/judge0/judge0.conf:/api/judge0.conf:ro
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${JUDGE0_POSTGRES_DB:-judge0}
      POSTGRES_USER: ${POSTGRES_USER:-cap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cap_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-cap_redis_password}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      judge0-server:
        condition: service_healthy
    networks: [cap-net]
    privileged: true
    restart: unless-stopped

networks:
  cap-net:
    external: true

volumes:
  # Explicit names, not project-prefixed. Compose namespaces volumes by project,
  # so renaming or splitting a project silently points it at a new empty volume --
  # which is exactly what happened moving off the single cap-platform project.
  # Pinning the name keeps the data attached to the data, not to the topology.
  cap-postgres-data:
    name: cap-postgres-data
  cap-redis-data:
    name: cap-redis-data
